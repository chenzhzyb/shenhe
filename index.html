<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小鹿AI编程 - 成绩查询</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.544.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.140.1/build/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --accent-color: #06b6d4;
            --success-color: #22c55e;
            --background-color: #0f172a;
            --card-background: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #cbd5e1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .bg-gradient {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        }

        .card {
            background-color: var(--card-background);
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .input-container {
            position: relative;
            margin: 2rem 0;
        }

        .input-container input {
            width: 100%;
            padding: 1rem 3rem 1rem 1rem;
            border: 2px solid #334155;
            border-radius: 0.5rem;
            background-color: rgba(30, 41, 59, 0.7);
            color: var(--text-color);
            font-size: 1.1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
        }

        .input-container input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background-color: rgba(30, 41, 59, 0.9);
        }

        .input-container .icon {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            transition: color 0.3s ease;
        }

        .input-container input:focus + .icon {
            color: var(--primary-color);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 0.875rem 2rem;
            border: none;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 1.125rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:active {
            transform: translateY(-1px) scale(0.98);
        }

        .btn-primary:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
        }

        .hidden {
            display: none;
        }

        .toast {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            left: 1.5rem;
            max-width: calc(100% - 3rem);
            background-color: #22c55e;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            transform: translateY(-150px);
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0 auto;
        }

        .toast.show {
            transform: translateY(0);
        }

        .toast.error {
            background-color: #ef4444;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
        }

        #result-card {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        #result-card.show {
            opacity: 1;
            transform: translateY(0);
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #f00;
            border-radius: 50%;
            animation: confetti-fall 3s ease-in-out forwards;
            z-index: 1000;
            opacity: 0;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .logo-container img {
            max-width: 180px;
            width: 80%;
            filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.5));
            transition: transform 0.3s ease;
        }
        
        .logo-container img:hover {
            transform: scale(1.05);
        }

        .shine {
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.2) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            animation: shine 3s infinite;
        }

        @keyframes shine {
            100% {
                left: 100%;
            }
        }

        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
            100% {
                transform: translateY(0px);
            }
        }

        .glow {
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
        }

        .result-icon {
            position: relative;
            display: inline-block;
        }

        .result-icon i {
            position: relative;
            z-index: 1;
        }

        @keyframes pulse {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.8;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 0.4;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.8;
            }
        }

        /* 响应式设计 - 小屏幕设备 */
        @media (max-width: 640px) {
            h1 {
                font-size: 2rem !important;
            }
            
            .input-container input {
                font-size: 1rem;
                padding: 0.875rem 3rem 0.875rem 1rem;
            }
            
            .btn-primary {
                padding: 0.625rem 1.5rem;
            }
            
            .logo-container img {
                max-width: 150px;
            }
            
            .card {
                margin: 1rem;
            }
            
            #result-card {
                padding: 1.5rem;
            }
            
            h2 {
                font-size: 1.5rem !important;
            }
            
            .result-icon i {
                width: 120px !important;
                height: 120px !important;
            }
        }

        /* 响应式设计 - 超小屏幕设备 */
        @media (max-width: 375px) {
            h1 {
                font-size: 1.75rem !important;
            }
            
            .logo-container img {
                max-width: 120px;
            }
            
            body {
                padding: 1rem;
            }
            
            .card {
                margin: 0.5rem;
                padding: 1.25rem;
            }
            
            .input-container {
                margin: 1.5rem 0;
            }
        }

        /* 响应式设计 - 大屏幕设备优化 */
        @media (min-width: 1024px) {
            .card {
                max-width: 500px;
            }
        }

        /* 弹窗样式 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            opacity: 1;
        }

        .modal.hidden {
            display: none;
        }

        .modal-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(3px);
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            position: relative;
            background-color: var(--card-background);
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 400px;
            animation: modalSlideIn 0.3s ease-out;
            transform-origin: center;
        }

        .modal-header {
            padding: 1.5rem 2rem 0;
            text-align: center;
        }

        .modal-logo {
            max-width: 120px;
            width: 50%;
            filter: drop-shadow(0 0 5px rgba(99, 102, 241, 0.3));
        }

        .modal-body {
            padding: 1.5rem 2rem;
            text-align: center;
        }

        .modal-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 50%;
            margin-bottom: 1.5rem;
        }

        .modal-icon i {
            width: 30px;
            height: 30px;
            color: white;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 1rem;
        }

        .modal-text {
            font-size: 1.1rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 0;
        }

        .modal-footer {
            padding: 0 2rem 2rem;
            display: flex;
            justify-content: center;
        }

        .modal-footer .btn-primary {
            min-width: 120px;
        }

        /* 弹窗动画 */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.9;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        /* 弹窗响应式设计 */
        @media (max-width: 640px) {
            .modal-content {
                width: 95%;
                margin: 1rem;
            }
            
            .modal-header {
                padding: 1.25rem 1.5rem 0;
            }
            
            .modal-logo {
                max-width: 100px;
            }
            
            .modal-body {
                padding: 1.25rem 1.5rem;
            }
            
            .modal-footer {
                padding: 0 1.5rem 1.5rem;
            }
            
            .modal-icon {
                width: 50px;
                height: 50px;
                margin-bottom: 1.25rem;
            }
            
            .modal-icon i {
                width: 25px;
                height: 25px;
            }
            
            .modal-title {
                font-size: 1.25rem;
            }
            
            .modal-text {
                font-size: 1rem;
            }
        }

        @media (max-width: 375px) {
            .modal-body {
                padding: 1.25rem;
            }
            
            .modal-footer {
                padding: 0 1.25rem 1.25rem;
            }
            
            .modal-text {
                font-size: 0.9375rem;
            }
        }

        .back-button {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.3s ease, transform 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-button:hover {
            color: var(--text-color);
            transform: translateX(-5px);
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle 5s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.2;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

        </button>

            <img src="https://p3-flow-imagex-download-sign.byteimg.com/tos-cn-i-a9rns2rl98/c8bf2f58c69f476b8972729461bb49f5.png~tplv-a9rns2rl98-24:720:720.png?rcl=2025123016442661B5625234694A36ED46&rk3s=8e244e95&rrcfp=8a172a1a&x-expires=1767689066&x-signature=XoRaDyeXH8OZ77ixBPWYjHnJHDE%3D" alt="小鹿AI编程">
        </div>

        <p class="text-center text-gray-400 mb-8 text-sm leading-relaxed">请输入学生姓名，查询审核结果</p>

        <div id="search-container">

                <input type="text" id="name-input" placeholder="请输入学生姓名" autocomplete="off" class="focus:ring-2 focus:ring-blue-500">

                    审核通过

            </div>

    </div>

    <script>
        // ==================== 配置区域 START ====================
        // TODO: cm6HRAQaUE5Z！
        const SHEET_ID = 'cm6HRAQaUE5Z'; // 例如：从地址栏 `https://www.kdocs.cn/l/cm6HRAQaUE5Z`  中提取
        // TODO: 调整数据范围，例如 A:B 表示读取A列和B列的全部数据。如果你的数据在100行以内，也可以设为 A1:B100
        const DATA_RANGE = 'A:B';
        // ==================== 配置区域 END ====================

        // 全局变量，用于存储从表格获取的数据
        let studentData = [];

        const nameInput = document.getElementById('name-input');
        const searchBtn = document.getElementById('search-btn');
        const resultCard = document.getElementById('result-card');
        const studentNameEl = document.getElementById('student-name');
        const resultMessageEl = document.getElementById('result-message');
        const searchContainer = document.getElementById('search-container');
        const toast = document.getElementById('toast');
        const backButton = document.getElementById('back-button');
        const canvasContainer = document.getElementById('canvas-container');
        // 弹窗相关元素
        const infoModal = document.getElementById('info-modal');
        const modalOkBtn = document.getElementById('modal-ok-btn');

        lucide.createIcons();

        // 创建星空背景
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                star.style.left = `${Math.random() * 100}vw`;
                star.style.top = `${Math.random() * 100}vh`;
                star.style.width = `${Math.random() * 3 + 1}px`;
                star.style.height = star.style.width;
                star.style.animationDelay = `${Math.random() * 5}s`;
                starsContainer.appendChild(star);
            }
        }

        // 初始化Three.js场景
        function initThreeScene() {
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            const renderer = new THREE.WebGLRenderer({ alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            canvasContainer.appendChild(renderer.domElement);

            // 创建粒子系统
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCount = 1500;

            const posArray = new Float32Array(particlesCount * 3);

            for (let i = 0; i < particlesCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 10;
            }

            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

            const particlesMaterial = new THREE.PointsMaterial({
                size: 0.005,
                color: 0x6366f1,
                transparent: true,
                opacity: 0.8
            });

            const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particlesMesh);

            camera.position.z = 5;

            // 动画循环
            function animate() {
                requestAnimationFrame(animate);
                
                particlesMesh.rotation.y += 0.001;
                particlesMesh.rotation.x += 0.0005;

                renderer.render(scene, camera);
            }

            animate();

            // 响应窗口大小变化
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function showToast(message, type = 'success') {
            toast.textContent = message;
            toast.className = `toast ${type === 'error' ? 'error' : ''}`;
            
            // 添加图标
            const icon = document.createElement('i');
            icon.setAttribute('data-lucide', type === 'error' ? 'x-circle' : 'check-circle');
            toast.prepend(icon);
            lucide.createIcons();
            
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    toast.innerHTML = '';
                }, 300);
            }, 3000);
        }

        function createConfetti() {
            const colors = ['#f00', '#0f0', '#00f', '#ff0', '#f0f', '#0ff', '#fff'];
            for (let i = 0; i < 200; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                // 随机形状
                if (Math.random() > 0.5) {
                    confetti.style.borderRadius = '50%';
                } else {
                    confetti.style.borderRadius = '0';
                }
                
                confetti.style.left = `${Math.random() * 100}vw`;
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = `${Math.random() * 3}s`;
                confetti.style.animationDuration = `${3 + Math.random() * 2}s`;
                
                // 随机大小
                const size = Math.random() * 10 + 5;
                confetti.style.width = `${size}px`;
                confetti.style.height = `${size}px`;
                
                document.body.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }

        /**
         * 从金山文档表格获取数据的主函数
         */
        async function fetchDataFromKingsoftSheet() {
            try {
                // 1. 构造金山文档的公开API地址（无需认证，但表格需设为“可查看”）
                const apiUrl = `https://www.kdocs.cn/api/office/p/file/${SHEET_ID}/sheet/0/range?range=${DATA_RANGE}`;
                
                // 2. 发起网络请求
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error(`表格数据获取失败，状态码: ${response.status}`);
                }
                
                // 3. 解析返回的JSON数据
                const jsonData = await response.json();
                console.log('从API返回的原始数据:', jsonData); // 调试用，了解数据结构

                // 4. 处理数据：将表格的二维数组转换为对象数组
                // 假设API返回格式为 { cells: [ [表头1, 表头2], [数据1行1, 数据1行2], ... ] }
                const rows = jsonData.cells || [];
                if (rows.length < 2) {
                    console.warn('表格数据为空或仅包含表头');
                    studentData = [];
                    return;
                }

                // 跳过第一行表头（如果第一行是数据，则改为 rows.slice(0)）
                const dataRows = rows.slice(1);
                
                // 转换为网站需要的格式：{ name: 'xxx', result: 'xxx' }
                studentData = dataRows.map(row => ({
                    name: String(row[0] || '').trim(),   // A列：姓名，去除首尾空格
                    result: String(row[1] || '').trim()  // B列：结果
                }));

                console.log('数据转换成功，共', studentData.length, '条记录:', studentData);

            } catch (error) {
                console.error('加载表格数据时发生严重错误:', error);
                // 可选：在这里可以设置一个友好的用户提示，或加载一个本地备份数据
                // studentData = [...]; // 备份数据
            }
        }

        function searchStudent() {
            const name = nameInput.value.trim();
            if (!name) {
                // 更新弹窗文案
                const modalText = document.querySelector('.modal-text');
                modalText.textContent = '请输入学生姓名';
                
                // 显示弹窗
                infoModal.classList.remove('hidden');
                setTimeout(() => {
                    infoModal.classList.add('show');
                }, 10);
                return;
            }

            const student = studentData.find(s => s.name === name);

            if (student) {
                // 先更新内容
                studentNameEl.textContent = student.name;
                resultMessageEl.textContent = student.result;
                
                // 确保resultCard在正确的状态
                resultCard.classList.remove('show');
                
                gsap.to(searchContainer, {
                    opacity: 0,
                    y: -20,
                    duration: 0.5,
                    onComplete: () => {
                        searchContainer.classList.add('hidden');
                        resultCard.classList.remove('hidden');
                        backButton.classList.remove('hidden');
                        lucide.createIcons();
                        
                        // 重置resultCard的transform状态
                        gsap.set(resultCard, { opacity: 0, y: 20 });
                        
                        setTimeout(() => {
                            // 显示结果卡片
                            gsap.to(resultCard, {
                                opacity: 1,
                                y: 0,
                                duration: 0.5,
                                onComplete: () => {
                                    resultCard.classList.add('show');
                                }
                            });
                            
                            createConfetti();
                            
                            // 添加卡片发光效果
                            gsap.to('.card', {
                                boxShadow: '0 0 25px rgba(99, 102, 241, 0.5)',
                                duration: 0.5,
                                yoyo: true,
                                repeat: 1
                            });
                            
                            // 延迟显示弹窗，让用户先看到结果
                            setTimeout(() => {
                                // 更新弹窗文案，包含孩子姓名
                                const modalText = document.querySelector('.modal-text');
                                modalText.textContent = `${student.name}家长，恭喜孩子通过本次选拔，抓紧时间把本页截图给班主任老师办理进班手续吧`;
                                
                                infoModal.classList.remove('hidden');
                                setTimeout(() => {
                                    infoModal.classList.add('show');
                                }, 10);
                            }, 1000);
                        }, 100);
                    }
                });
            } else {
                // 添加输入框震动效果
                gsap.fromTo(nameInput, 
                    { x: 0 },
                    {
                        x: 10, 
                        duration: 0.1, 
                        repeat: 5, 
                        yoyo: true,
                        onComplete: () => {
                            gsap.set(nameInput, { x: 0 });
                            
                            // 更新弹窗文案
                            const modalText = document.querySelector('.modal-text');
                            modalText.textContent = '未找到该学生信息';
                            
                            // 显示弹窗
                            infoModal.classList.remove('hidden');
                            setTimeout(() => {
                                infoModal.classList.add('show');
                            }, 10);
                        }
                    }
                );
            }
        }

        function resetSearch() {
            nameInput.value = '';
            resultCard.classList.remove('show');
            backButton.classList.add('hidden');
            
            gsap.to(resultCard, {
                opacity: 0,
                y: 20,
                duration: 0.5,
                onComplete: () => {
                    resultCard.classList.add('hidden');
                    searchContainer.classList.remove('hidden');
                    gsap.fromTo(searchContainer, 
                        { opacity: 0, y: -20 },
                        { opacity: 1, y: 0, duration: 0.5 }
                    );
                }
            });
        }

        // 关闭弹窗函数
        function closeModal() {
            infoModal.classList.remove('show');
            setTimeout(() => {
                infoModal.classList.add('hidden');
            }, 300);
        }

        /**
         * 页面初始化
         */
        document.addEventListener('DOMContentLoaded', function() {
            console.log('页面加载完毕，开始初始化...');
            
            // 1. 加载表格数据
            fetchDataFromKingsoftSheet();
            
            // 2. 创建星空背景和粒子效果
            createStars();
            initThreeScene();
            
            // 3. 页面加载动画
            gsap.fromTo('.card', 
                { opacity: 0, y: 50 },
                {
                    opacity: 1, 
                    y: 0, 
                    duration: 1, 
                    ease: 'back.out(1.7)',
                    onComplete: () => {
                        // 输入框聚焦动画
                        gsap.to(nameInput, {
                            boxShadow: '0 0 15px rgba(99, 102, 241, 0.3)',
                            duration: 1,
                            yoyo: true,
                            repeat: -1
                        });
                    }
                }
            );

            // 标题动画
            gsap.fromTo('h1', 
                { opacity: 0, y: -20 },
                { opacity: 1, y: 0, duration: 0.8, delay: 0.3 }
            );

            // 段落动画
            gsap.fromTo('p', 
                { opacity: 0 },
                { opacity: 1, duration: 0.8, delay: 0.5 }
            );
            
            // 4. 绑定查询按钮的点击事件
            if (searchBtn) {
                searchBtn.addEventListener('click', searchStudent);
            }
            
            // 5. 绑定输入框的回车事件
            if (nameInput) {
                nameInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        searchStudent();
                    }
                });
            }
            
            backButton.addEventListener('click', resetSearch);
            resultCard.addEventListener('click', resetSearch);
            
            // 弹窗确定按钮点击事件
            modalOkBtn.addEventListener('click', closeModal);
            
            // 点击弹窗背景关闭弹窗
            infoModal.addEventListener('click', (e) => {
                if (e.target.classList.contains('modal-backdrop')) {
                    closeModal();
                }
            });
            
            // 为输入框添加清除功能
            nameInput.addEventListener('input', () => {
                if (nameInput.value) {
                    const clearIcon = document.querySelector('.icon');
                    clearIcon.setAttribute('data-lucide', 'x');
                    lucide.createIcons();
                    clearIcon.addEventListener('click', () => {
                        nameInput.value = '';
                        clearIcon.setAttribute('data-lucide', 'search');
                        lucide.createIcons();
                    });
                } else {
                    const clearIcon = document.querySelector('.icon');
                    clearIcon.setAttribute('data-lucide', 'search');
                    lucide.createIcons();
                }
            });
            
            // 添加鼠标移动视差效果
            document.addEventListener('mousemove', (e) => {
                const mouseX = e.clientX / window.innerWidth - 0.5;
                const mouseY = e.clientY / window.innerHeight - 0.5;
                
                gsap.to('.card', {
                    x: mouseX * 10,
                    y: mouseY * 10,
                    duration: 0.5
                });
            });
            
            console.log('初始化完成，网站已准备就绪。');
        });
    </script>
</body>
</html>
