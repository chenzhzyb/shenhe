<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小鹿AI编程 - 成绩查询</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.544.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.140.1/build/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --accent-color: #06b6d4;
            --success-color: #22c55e;
            --background-color: #0f172a;
            --card-background: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #cbd5e1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .bg-gradient {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        }

        .card {
            background-color: var(--card-background);
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .input-container {
            position: relative;
            margin: 2rem 0;
        }

        .input-container input {
            width: 100%;
            padding: 1rem 3rem 1rem 1rem;
            border: 2px solid #334155;
            border-radius: 0.5rem;
            background-color: rgba(30, 41, 59, 0.7);
            color: var(--text-color);
            font-size: 1.1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
        }

        .input-container input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background-color: rgba(30, 41, 59, 0.9);
        }

        .input-container .icon {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            transition: color 0.3s ease;
        }

        .input-container input:focus + .icon {
            color: var(--primary-color);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 0.875rem 2rem;
            border: none;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 1.125rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:active {
            transform: translateY(-1px) scale(0.98);
        }

        .btn-primary:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
        }

        .hidden {
            display: none;
        }

        .toast {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            left: 1.5rem;
            max-width: calc(100% - 3rem);
            background-color: #22c55e;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            transform: translateY(-150px);
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0 auto;
        }

        .toast.show {
            transform: translateY(0);
        }

        .toast.error {
            background-color: #ef4444;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
        }

        #result-card {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        #result-card.show {
            opacity: 1;
            transform: translateY(0);
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #f00;
            border-radius: 50%;
            animation: confetti-fall 3s ease-in-out forwards;
            z-index: 1000;
            opacity: 0;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .logo-container img {
            max-width: 180px;
            width: 80%;
            filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.5));
            transition: transform 0.3s ease;
        }
        
        .logo-container img:hover {
            transform: scale(1.05);
        }

        .shine {
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.2) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            animation: shine 3s infinite;
        }

        @keyframes shine {
            100% {
                left: 100%;
            }
        }

        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
            100% {
                transform: translateY(0px);
            }
        }

        .glow {
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
        }

        .result-icon {
            position: relative;
            display: inline-block;
        }

        .result-icon i {
            position: relative;
            z-index: 1;
        }

        @keyframes pulse {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.8;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 0.4;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.8;
            }
        }

        /* 响应式设计 - 小屏幕设备 */
        @media (max-width: 640px) {
            h1 {
                font-size: 2rem !important;
            }
            
            .input-container input {
                font-size: 1rem;
                padding: 0.875rem 3rem 0.875rem 1rem;
            }
            
            .btn-primary {
                padding: 0.625rem 1.5rem;
            }
            
            .logo-container img {
                max-width: 150px;
            }
            
            .card {
                margin: 1rem;
            }
            
            #result-card {
                padding: 1.5rem;
            }
            
            h2 {
                font-size: 1.5rem !important;
            }
            
            .result-icon i {
                width: 120px !important;
                height: 120px !important;
            }
        }

        /* 响应式设计 - 超小屏幕设备 */
        @media (max-width: 375px) {
            h1 {
                font-size: 1.75rem !important;
            }
            
            .logo-container img {
                max-width: 120px;
            }
            
            body {
                padding: 1rem;
            }
            
            .card {
                margin: 0.5rem;
                padding: 1.25rem;
            }
            
            .input-container {
                margin: 1.5rem 0;
            }
        }

        /* 响应式设计 - 大屏幕设备优化 */
        @media (min-width: 1024px) {
            .card {
                max-width: 500px;
            }
        }

        /* 弹窗样式 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            opacity: 1;
        }

        .modal.hidden {
            display: none;
        }

        .modal-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(3px);
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            position: relative;
            background-color: var(--card-background);
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 400px;
            animation: modalSlideIn 0.3s ease-out;
            transform-origin: center;
        }

        .modal-header {
            padding: 1.5rem 2rem 0;
            text-align: center;
        }

        .modal-logo {
            max-width: 120px;
            width: 50%;
            filter: drop-shadow(0 0 5px rgba(99, 102, 241, 0.3));
        }

        .modal-body {
            padding: 1.5rem 2rem;
            text-align: center;
        }

        .modal-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 50%;
            margin-bottom: 1.5rem;
        }

        .modal-icon i {
            width: 30px;
            height: 30px;
            color: white;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 1rem;
        }

        .modal-text {
            font-size: 1.1rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 0;
        }

        .modal-footer {
            padding: 0 2rem 2rem;
            display: flex;
            justify-content: center;
        }

        .modal-footer .btn-primary {
            min-width: 120px;
        }

        /* 弹窗动画 */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.9;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        /* 弹窗响应式设计 */
        @media (max-width: 640px) {
            .modal-content {
                width: 95%;
                margin: 1rem;
            }
            
            .modal-header {
                padding: 1.25rem 1.5rem 0;
            }
            
            .modal-logo {
                max-width: 100px;
            }
            
            .modal-body {
                padding: 1.25rem 1.5rem;
            }
            
            .modal-footer {
                padding: 0 1.5rem 1.5rem;
            }
            
            .modal-icon {
                width: 50px;
                height: 50px;
                margin-bottom: 1.25rem;
            }
            
            .modal-icon i {
                width: 25px;
                height: 25px;
            }
            
            .modal-title {
                font-size: 1.25rem;
            }
            
            .modal-text {
                font-size: 1rem;
            }
        }

        @media (max-width: 375px) {
            .modal-body {
                padding: 1.25rem;
            }
            
            .modal-footer {
                padding: 0 1.25rem 1.25rem;
            }
            
            .modal-text {
                font-size: 0.9375rem;
            }
        }

        .back-button {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.3s ease, transform 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-button:hover {
            color: var(--text-color);
            transform: translateX(-5px);
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle 5s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.2;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }
    </style>
</head>

    <script>
        // ============================================
        // 配置信息 - 必须修改！！！

        const PUBLIC_SHEETS_API_URL = 'https://opensheet.elk.sh/1oAIRJO9vUgqLfy_sC62libWReRiHuwou_eCBdPZS27g/Sheet1'; // 替换为你的地址

        const nameInput = document.getElementById('name-input');

        // 初始化图标
        lucide.createIcons();
        
        // ============================================

        // ============================================
        function showToast(message, type = 'success') {
            toast.textContent = message;
            toast.className = `toast ${type === 'error' ? 'error' : ''}`;
            const icon = document.createElement('i');
            icon.setAttribute('data-lucide', type === 'error' ? 'x-circle' : 'check-circle');
            toast.prepend(icon);
            lucide.createIcons();
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => { toast.innerHTML = ''; }, 300);

        /**

            // 显示加载状态
            const searchIcon = document.querySelector('.input-container .icon');
            if (searchIcon) {
                const originalIcon = searchIcon.getAttribute('data-lucide');
                searchIcon.setAttribute('data-lucide', 'loader-2');

                searchIcon.style.animation = 'spin 1s linear infinite';

            // 本地备份数据

                { name: "浩然", result: "科特种子班通过" },
                { name: "宇辰", result: "科特种子班通过" },
                { name: "俊熙", result: "思维赛考班通过" },
                { name: "星睿", result: "思维赛考班通过" }
            ];
            
            let isApiSuccess = false;
            let retryCount = 0;
            const maxRetries = 3;
            const timeoutMs = 30000; // 30秒超时
            
            // 实现超时功能的辅助函数
            const fetchWithTimeout = (url, options = {}) => {
                return Promise.race([
                    fetch(url, options),
                    new Promise((_, reject) => 
                        setTimeout(() => reject(new Error('请求超时')), timeoutMs)
                    )
                ]);
            };
            
            while (retryCount < maxRetries && !isApiSuccess) {
                try {
                    retryCount++;

                    // 1. 发起带超时的请求到公开接口
                    const response = await fetchWithTimeout(PUBLIC_SHEETS_API_URL);
                    if (!response.ok) {
                        throw new Error(`数据获取失败 (状态码: ${response.status})`);
                    }
                    
                    // 2. 解析返回的JSON数据
                    const rawData = await response.json();
                    console.log('[数据加载日志] 从API获取的原始数据:', rawData);
                    
                    // 3. 转换数据格式 - opensheet.elk.sh返回直接的JSON数组
                    const parsedData = rawData
                        .map(row => {
                            // 处理不同可能的列名格式
                            const name = row["姓名"] || row["name"] || row["Name"] || '';
                            const result = row["审核结果"] || row["result"] || row["Result"] || '';
                            return {
                                name: String(name).trim(),
                                result: String(result).trim()
                            };
                        })
                        .filter(item => item.name && item.result); // 过滤无效数据
                    
                    // 4. 验证解析结果
                    console.log('[数据解析日志] 原始数据行数:', rawData.length, '解析后有效数据行数:', parsedData.length);
                    
                    if (parsedData.length === 0) {
                        throw new Error('解析后的数据为空');
                    }
                    
                    // 4. 数据加载成功
                    studentData = parsedData;
                    isApiSuccess = true;
                    
                    console.log(`[数据加载日志] API数据加载成功，共 ${studentData.length} 条记录，重试次数: ${retryCount-1}`);
                    showToast('名单数据已更新', 'success');
                    break;
                    
                } catch (error) {
                    console.error(`[数据加载日志] 第 ${retryCount} 次API请求失败:`, error.message);
                    
                    if (retryCount >= maxRetries) {
                        // 所有重试都失败
                        console.error(`[数据加载日志] API请求全部失败，切换到本地备份数据`);
                        studentData = backupData;
                        showToast('使用本地备份数据', 'success');
                        break;
                    }
                    
                    // 等待一段时间后重试
                    const waitTime = Math.pow(2, retryCount) * 1000; // 指数退避策略
                    console.log(`[数据加载日志] 将在 ${waitTime}ms 后重试...`);
                    await new Promise(resolve => setTimeout(resolve, waitTime));
                }
            }
            
            // 记录最终数据来源
            console.log(`[数据加载日志] 数据加载完成，来源: ${isApiSuccess ? 'API' : '本地备份'}，数据条数: ${studentData.length}`);
            
            // 恢复搜索图标
            if (searchIcon) {
                searchIcon.setAttribute('data-lucide', 'search');
                searchIcon.style.animation = '';
                lucide.createIcons();
            }
        }

        // ============================================
        // 核心函数：查询学生
        // ============================================
        function searchStudent() {
            const name = nameInput.value.trim();
            if (!name) {
                modalText.textContent = '请输入学生姓名';
                showModal();
                return;
            }

            // 在实时数据中查找
            const student = studentData.find(s => s.name === name);

            if (student) {
                // 找到学生
                studentNameEl.textContent = student.name;
                resultMessageEl.textContent = student.result;

                // 动画显示结果
                resultCard.classList.remove('show');
                gsap.to(searchContainer, {
                    opacity: 0,
                    y: -20,
                    duration: 0.5,
                    onComplete: () => {
                        searchContainer.classList.add('hidden');
                        resultCard.classList.remove('hidden');
                        backButton.classList.remove('hidden');
                        setTimeout(() => {
                            gsap.to(resultCard, {
                                opacity: 1,
                                y: 0,
                                duration: 0.5,
                                onComplete: () => {
                                    resultCard.classList.add('show');
                                }
                            });

                            // 显示提示弹窗
                            setTimeout(() => {
                                modalText.textContent = `${student.name}家长，恭喜孩子通过本次选拔，抓紧时间把本页截图给班主任老师办理进班手续吧`;
                                showModal();
                            }, 1000);
                        }, 100);
                    }
                });
            } else {
                // 未找到学生
                gsap.fromTo(nameInput, { x: 0 }, {
                    x: 10, duration: 0.1, repeat: 5, yoyo: true,
                    onComplete: () => {
                        gsap.set(nameInput, { x: 0 });
                        modalText.textContent = '未找到该学生信息';
                        showModal();
                    }
                });
            }
        }

        // ============================================
        // 5. 页面初始化
        // ============================================
        document.addEventListener('DOMContentLoaded', async function() {
            // 页面加载动画
            gsap.fromTo('.card', 
                { opacity: 0, y: 50 },
                { opacity: 1, y: 0, duration: 1, ease: 'back.out(1.7)' }
            );
            gsap.fromTo('h1', { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.8, delay: 0.3 });
            gsap.fromTo('p', { opacity: 0 }, { opacity: 1, duration: 0.8, delay: 0.5 });

            // 首次加载数据
            await fetchDataFromGoogleSheets();

            // 绑定事件
            searchBtn.addEventListener('click', searchStudent);
            nameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') searchStudent(); });
            backButton.addEventListener('click', resetSearch);
            modalOkBtn.addEventListener('click', closeModal);
            infoModal.addEventListener('click', (e) => { if (e.target.classList.contains('modal-backdrop')) closeModal(); });

            // 输入框动态效果
            nameInput.addEventListener('input', function() {
                const icon = document.querySelector('.input-container .icon');
                if (this.value) {
                    icon.setAttribute('data-lucide', 'x');
                    icon.onclick = () => {
                        this.value = '';
                        icon.setAttribute('data-lucide', 'search');
                        lucide.createIcons();
                    };
                } else {
                    icon.setAttribute('data-lucide', 'search');
                    icon.onclick = null;
                }
                lucide.createIcons();
            });
        });
    </script>
</body>
</html>
